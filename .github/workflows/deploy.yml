name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Hashed assets never change under a given name -> cache them forever.
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "registerSW.js" \
            --exclude "manifest.webmanifest" \
            --exclude "_redirects" \
            --cache-control "public,max-age=31536000,immutable"

      # The shell files must never be cached, or the PWA serves a stale app.
      - name: Sync entry points
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --exclude "*" \
            --include "index.html" \
            --include "sw.js" \
            --include "registerSW.js" \
            --include "manifest.webmanifest" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/sw.js" "/registerSW.js" "/manifest.webmanifest"
