name: Test

# Runs on every PR, and is called by deploy.yml so a failing test blocks
# both deploys. The tests use only node: builtins and src/, so no npm ci.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run test:credkey
      - run: npm run test:transcript
      - run: npm run test:levels
