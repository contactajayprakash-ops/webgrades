<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <!-- Raster fallback so Google's favicon crawler (which often ignores SVG) has
         a PNG to show next to the search result. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="mask-icon" href="/favicon.svg?v=3" color="#4aa9ff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <!-- PWA: makes "Add to Home Screen" open a standalone, app-like window -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WebGrades" />
    <meta name="theme-color" content="#eef0f5" />
    <script>
      // Apply the saved theme before first paint so there's no flash. Light is
      // the default when nothing is stored.
      try {
        var t = JSON.parse(localStorage.getItem('wg_theme') || '{}');
        if ((t.theme || 'light') === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
    <!-- Fonts are self-hosted (see @font-face in index.css) so the school's font
         filter can never block first paint. Preconnect to Firestore instead, so
         the TLS handshake for the snapshot read (task A) is already warm. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- Snapshot preflight: start the grades fetch NOW, from the HTML, instead of
         waiting for ~104 KB of JS to download+parse+mount first. Credentials are a
         synchronous localStorage read, so this can run before the bundle exists.
         src/lib/snapshotRead.js awaits window.__wgSnap and reuses the result when
         it's for the active profile (else falls through to its own fetch). The
         hash string MUST stay byte-identical to the Pi / cloudSync.js / the inline
         case in scripts/test-credkey-parity.mjs: `username + ' ' + password`. -->
    <script>
      window.__wgSnap = (async function () {
        var p;
        try {
          var profs = JSON.parse(localStorage.getItem('wg_profiles') || '[]');
          var active = localStorage.getItem('wg_active');
          p = profs.filter(function (x) { return x && x.username === active; })[0] || profs[0];
          if (!p || !p.username || !p.password) return null;
        } catch (e) { return null; }
        try {
          var bytes = new TextEncoder().encode(p.username + ' ' + p.password);
          var buf = await crypto.subtle.digest('SHA-256', bytes);
          var id = Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return b.toString(16).padStart(2, '0');
          }).join('');
          // Hard deadline: on the school network Firestore may be black-holed (hang),
          // so bound it — a hang here must not strand the snapshot read.
          var sig; try { sig = AbortSignal.timeout(2500); } catch (e) { sig = undefined; }
          var r = await fetch('https://firestore.googleapis.com/v1/projects/webgrades'
            + '/databases/(default)/documents/grades/' + id
            + '?key=AIzaSyCjM4oh7m96ZaU4zLWE-m81JJKVPxkZ4Q0', { signal: sig });
          return { username: p.username, doc: r.ok ? await r.json() : null };
        } catch (e) { return { username: p.username, doc: null }; } // report the user so readSnapshot won't re-fetch
      })();
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TTB99XSK4T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TTB99XSK4T');
    </script>

    <title>WebGrades — Frisco ISD Grades &amp; Weighted GPA Calculator</title>
    <meta name="description" content="A faster way to check your Frisco ISD grades from Home Access Center (HAC) — with the real weighted GPA, class rank, and what-if grade calculator that HAC itself doesn't show." />
    <meta name="keywords" content="WebGrades, Frisco ISD, HAC, Home Access Center, Frisco grades, weighted GPA, GPA calculator, class rank, Frisco ISD GPA" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://webgrades.firebaseapp.com/" />

    <!-- Open Graph (link previews on iMessage, Discord, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WebGrades" />
    <meta property="og:title" content="WebGrades — Frisco ISD Grades &amp; Weighted GPA" />
    <meta property="og:description" content="Check your Frisco ISD grades from HAC with the real weighted GPA, class rank, and a live what-if calculator HAC doesn't give you." />
    <meta property="og:url" content="https://webgrades.firebaseapp.com/" />
    <meta property="og:image" content="https://webgrades.firebaseapp.com/icon-512.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WebGrades — Frisco ISD Grades &amp; Weighted GPA" />
    <meta name="twitter:description" content="Check your Frisco ISD grades from HAC with the real weighted GPA, class rank, and a live what-if calculator HAC doesn't give you." />
    <meta name="twitter:image" content="https://webgrades.firebaseapp.com/icon-512.png" />

    <!-- Structured data: helps Google understand this is a free web app -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "WebGrades",
        "url": "https://webgrades.firebaseapp.com/",
        "description": "A faster way to check Frisco ISD grades from Home Access Center (HAC), with the real weighted GPA, class rank, and a what-if grade calculator that HAC doesn't show.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, iOS, Android, Chrome OS",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- WebSite schema — this is what Google uses to show "WebGrades" as the
         site name in search results (instead of the hosting domain name). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "WebGrades",
        "alternateName": "Frisco ISD WebGrades",
        "url": "https://webgrades.firebaseapp.com/"
      }
    </script>

    <!-- Boot skeleton: painted from the HTML itself (no CSS/JS bundle needed) so
         the user sees the app's shape instantly instead of a blank page through
         the whole boot. React replaces #root on mount. Reads data-theme (set by
         the theme script above) so it's not white-on-black for dark mode. -->
    <style>
      html { background: #06070c; }
      html[data-theme="light"] { background: #eef0f5; }
      .wg-skel { --c: rgba(255,255,255,.05); --c2: rgba(255,255,255,.09); padding: 84px 16px 24px; max-width: 1120px; margin: 0 auto; }
      html[data-theme="light"] .wg-skel { --c: rgba(0,0,0,.05); --c2: rgba(0,0,0,.09); }
      .wg-skel-nav { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: min(720px, 92%); height: 52px; border-radius: 26px; }
      .wg-skel-h { height: 34px; width: 210px; border-radius: 9px; margin: 4px 2px 22px; }
      .wg-skel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .wg-skel-tile { height: 118px; border-radius: 22px; }
      .wg-skel-nav, .wg-skel-h, .wg-skel-tile { background: linear-gradient(90deg, var(--c) 25%, var(--c2) 37%, var(--c) 63%); background-size: 200% 100%; animation: wg-sh 1.5s ease-in-out infinite; }
      @keyframes wg-sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      @media (max-width: 640px) { .wg-skel-grid { grid-template-columns: repeat(2, 1fr); } .wg-skel { padding-top: 72px; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="wg-skel" aria-hidden="true">
      <div class="wg-skel-nav"></div>
      <div class="wg-skel-h"></div>
      <div class="wg-skel-grid">
        <div class="wg-skel-tile"></div><div class="wg-skel-tile"></div><div class="wg-skel-tile"></div>
        <div class="wg-skel-tile"></div><div class="wg-skel-tile"></div><div class="wg-skel-tile"></div>
      </div>
    </div></div>
    <script>
      // The skeleton is the signed-in dashboard shape. A signed-out visitor would
      // just flash it before the login card, so clear it synchronously (before
      // paint) when there's no active profile.
      try {
        var _pr = JSON.parse(localStorage.getItem('wg_profiles') || '[]');
        var _ac = localStorage.getItem('wg_active');
        if (!_pr.some(function (p) { return p && p.username && p.password && (!_ac || p.username === _ac); })) {
          var _r = document.getElementById('root'); if (_r) _r.textContent = '';
        }
      } catch (e) {}
    </script>
    <noscript>
      <h1>WebGrades — Frisco ISD Grades &amp; Weighted GPA</h1>
      <p>
        WebGrades is a faster, cleaner way to check your Frisco ISD grades from
        Home Access Center (HAC). It shows the real weighted GPA, your class
        rank, and a live what-if grade calculator that HAC itself doesn't give
        you. Sign in with your HAC username and password to get started.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
